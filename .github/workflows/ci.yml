name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasi-backend
    steps:
      - uses: actions/checkout@v4
      - name: Read Java version from Maven
        id: java-version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = root.tag.partition("}")[0].removeprefix("{")
          prefix = f"{{{namespace}}}" if namespace else ""
          version = root.findtext(f"{prefix}properties/{prefix}java.version")
          if not version:
              raise SystemExit("pom.xml does not define java.version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version.strip()}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.version }}
      - name: Run backend unit Gate
        run: bash ./mvnw -Punit-tests verify
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-jacoco
          path: kasi-backend/target/site/jacoco-unit
          if-no-files-found: error

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasi-backend
    steps:
      - uses: actions/checkout@v4
      - name: Read Java version from Maven
        id: java-version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = root.tag.partition("}")[0].removeprefix("{")
          prefix = f"{{{namespace}}}" if namespace else ""
          version = root.findtext(f"{prefix}properties/{prefix}java.version")
          if not version:
              raise SystemExit("pom.xml does not define java.version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version.strip()}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.version }}
      - name: Run backend integration Gate
        run: bash ./mvnw -Pintegration-tests verify
      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-jacoco
          path: kasi-backend/target/site/jacoco-integration
          if-no-files-found: error

  backend-static-analysis:
    name: Backend Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasi-backend
    steps:
      - uses: actions/checkout@v4
      - name: Read Java version from Maven
        id: java-version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = root.tag.partition("}")[0].removeprefix("{")
          prefix = f"{{{namespace}}}" if namespace else ""
          version = root.findtext(f"{prefix}properties/{prefix}java.version")
          if not version:
              raise SystemExit("pom.xml does not define java.version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version.strip()}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.version }}
      - name: Run SpotBugs Gate
        run: bash ./mvnw -Pstatic-analysis -DskipTests verify

  admin:
    name: Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasi-admin-web
    steps:
      - uses: actions/checkout@v4
      - name: Read Node version from package.json
        id: node-version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          with open("package.json", encoding="utf-8") as package_file:
              version = json.load(package_file)["engines"]["node"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kasi-admin-web/package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run admin Gate
        run: pnpm check

  user:
    name: User
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasi-user-web
    steps:
      - uses: actions/checkout@v4
      - name: Read Node version from package.json
        id: node-version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          with open("package.json", encoding="utf-8") as package_file:
              version = json.load(package_file)["engines"]["node"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kasi-user-web/package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run user Gate
        run: pnpm check

  mysql-contract:
    name: MySQL Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasi-backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kasi_contract
          MYSQL_USER: kasi
          MYSQL_PASSWORD: kasi-contract
          MYSQL_ROOT_PASSWORD: root-contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-contract"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Read Java version from Maven
        id: java-version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = root.tag.partition("}")[0].removeprefix("{")
          prefix = f"{{{namespace}}}" if namespace else ""
          version = root.findtext(f"{prefix}properties/{prefix}java.version")
          if not version:
              raise SystemExit("pom.xml does not define java.version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version.strip()}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.version }}
      - name: Create migration schema
        env:
          MYSQL_PWD: root-contract
        run: mysql --host=127.0.0.1 --user=root --execute="CREATE DATABASE kasi_migration CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
      - name: Run Flyway migration
        env:
          FLYWAY_URL: jdbc:mysql://127.0.0.1:3306/kasi_migration?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
          FLYWAY_USER: root
          FLYWAY_PASSWORD: root-contract
        run: bash ./mvnw -Pmigration flyway:info flyway:migrate flyway:validate
      - name: Run focused MySQL contract
        env:
          MYSQL_CONTRACT_URL: jdbc:mysql://127.0.0.1:3306/kasi_contract?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
          MYSQL_CONTRACT_USERNAME: kasi
          MYSQL_CONTRACT_PASSWORD: kasi-contract
          MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:3306/kasi_migration?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
          MYSQL_MIGRATION_USERNAME: root
          MYSQL_MIGRATION_PASSWORD: root-contract
        run: bash ./mvnw -Pmysql-contract-tests -Dtest='*MySqlContractIT' test

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
