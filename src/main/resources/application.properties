spring.application.name=kasi-backend

# DataSource (injected via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kasi_promotion?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kasi.backend
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
app.jwt.secret=${JWT_SECRET:kasi-jwt-secret-key-must-be-at-least-256-bits-long}
app.jwt.expiration=7200

# Verification Code
app.verification-code.expiration=300
app.verification-code.resend-interval=60
app.verification-code.daily-limit=10

# Password Reset Token
app.password-reset.token-expiration=600

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Logging
logging.level.com.kasi.backend=DEBUG
