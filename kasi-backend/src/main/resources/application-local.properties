# Local development applies the same immutable migration chain used by releases.
# Development-only fallback; production must provide JWT_SECRET externally.
app.jwt.secret=${JWT_SECRET:local-development-only-jwt-secret-do-not-use-in-production}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
