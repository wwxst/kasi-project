spring.application.name=kasi-backend
spring.flyway.enabled=false

# DataSource (injected via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+08:00'

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kasi.backend
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=7200

# Verification Code
app.verification-code.expiration=300
app.verification-code.resend-interval=60
app.verification-code.daily-limit=10

# Password Reset Token
app.password-reset.token-expiration=600

# Provider Credentials
app.provider-credentials.master-key=${PROVIDER_CREDENTIAL_MASTER_KEY}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Administrator avatar upload
app.upload.dir=${APP_UPLOAD_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Logging
logging.level.com.kasi.backend=INFO
logging.level.com.kasi.backend.provider.mapper.ShortDramaConnectionMapper=INFO

# GoodShort
app.providers.goodshort.connect-timeout=3s
app.providers.goodshort.read-timeout=10s

# Media account filing tasks
app.promotion.filing.scheduler-enabled=true
app.promotion.filing.fixed-delay=30s
app.promotion.filing.batch-size=50
app.promotion.filing.lease-duration=2m
app.promotion.filing.first-query-delay=1m
app.promotion.filing.pending-query-interval=5m
app.promotion.filing.retry-delays=1m,5m,15m,30m,60m

# Drama catalog synchronization
app.promotion.drama.sync.scheduler-enabled=true
app.promotion.drama.sync.fixed-delay=5m
app.promotion.drama.sync.batch-size=10
app.promotion.drama.sync.page-size=100
app.promotion.drama.sync.lease-duration=2m
app.promotion.drama.sync.languages=ENGLISH,SPANISH,PORTUGUESE,DEUTSCH,FRENCH,BAHASA_INDONESIA,KOREAN,ARAB,THAI,JAPANESE,TRADITIONAL_CHINESE,POLISH,TURKISH

# GoodShort free content synchronization
app.promotion.drama.content-sync.batch-size=50
app.promotion.drama.content-sync.candidate-page-size=500
app.promotion.drama.content-sync.lease-duration=2m
app.promotion.drama.content-sync.max-retries=5
app.promotion.drama.content-sync.retry-delays=1m,5m,15m,30m,60m

# Fixed scheduled tasks
app.scheduled-task.scheduler-enabled=true
app.scheduled-task.fixed-delay=1m
app.scheduled-task.batch-size=10
app.scheduled-task.lease-duration=2m
